<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tic-Tac-Toe</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,#202a44 0%,transparent 35%),radial-gradient(circle at bottom right,#18233d 0%,transparent 35%),#090d18;color:#fff;display:flex;justify-content:center;align-items:center;padding:25px}.game{width:100%;max-width:1050px}.header{text-align:center;margin-bottom:24px}.logo{width:58px;height:58px;margin:auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(135deg,#667eea,#764ba2);box-shadow:0 12px 35px rgba(102,126,234,.28)}h1{margin-top:14px;font-size:32px}.subtitle{margin-top:7px;color:#8e99b5;font-size:14px}.mode-panel{background:rgba(20,27,45,.88);border:1px solid #29334d;border-radius:18px;padding:7px;display:flex;gap:6px;margin-bottom:18px}.mode-btn{flex:1;border:0;background:transparent;color:#8994ae;padding:12px 8px;border-radius:12px;cursor:pointer;font-weight:bold;transition:.2s}.mode-btn:hover{color:#fff;background:#1c263e}.mode-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:white}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.card,.online-card{background:rgba(16,22,38,.94);border:1px solid #29334d;border-radius:25px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.35)}.status{text-align:center;font-size:18px;font-weight:bold;min-height:28px;margin-bottom:18px}.status span{color:#7c8cff}.scoreboard{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:22px}.score{background:#11182a;border:1px solid #27314a;border-radius:15px;text-align:center;padding:13px 5px}.score-label{font-size:12px;color:#7f8aa4;margin-bottom:5px}.score-value{font-size:24px;font-weight:bold}.board{width:min(100%,430px);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #303b58;border-radius:18px;background:#11182a;color:white;font-size:clamp(45px,10vw,75px);font-weight:800;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center}.cell:hover:not(.disabled){background:#19233a;border-color:#5668a0;transform:translateY(-2px)}.cell.x{color:#6f82ff}.cell.o{color:#d18cff}.cell.winner{background:linear-gradient(135deg,#26376b,#32234d);border-color:#7d8cff;box-shadow:0 0 25px rgba(110,130,255,.25);transform:scale(1.03)}.cell.disabled{cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:22px}.action-btn{flex:1;border:1px solid #303b58;background:#151d31;color:#fff;padding:13px;border-radius:13px;cursor:pointer;font-weight:bold;transition:.2s}.action-btn:hover{background:#202b45}.action-btn.primary{border:0;background:linear-gradient(135deg,#667eea,#764ba2)}.action-btn.primary:hover{filter:brightness(1.12)}.footer{text-align:center;margin-top:17px;color:#66718c;font-size:12px}.online-card{display:none}.online-card.show{display:block}.online-card h2{font-size:20px;margin-bottom:12px}.online-card h3{font-size:16px;margin:18px 0 10px}.online-row{display:flex;gap:8px;margin-bottom:9px}.online-row input,.chat-input{min-width:0;flex:1;background:#11182a;color:#fff;border:1px solid #303b58;border-radius:10px;padding:11px;outline:none}.online-btn{border:0;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:10px;padding:11px 13px;font-weight:bold;cursor:pointer}.secondary{background:#151d31!important;border:1px solid #303b58!important}.room{padding:12px;background:#11182a;border:1px solid #27314a;border-radius:10px;margin-bottom:9px}.room small{display:block;color:#7f8aa4}.room strong{font-size:22px;letter-spacing:4px;color:#7c8cff}.notice{font-size:12px;color:#8994ae;line-height:1.5;margin:10px 0}.chat{height:245px;overflow:auto;background:#0b101b;border:1px solid #27314a;border-radius:12px;padding:9px;display:flex;flex-direction:column;gap:7px}.msg{max-width:90%;background:#18233a;border-radius:10px;padding:8px 10px;word-break:break-word}.msg.me{align-self:flex-end;background:#394bb0}.msg small{display:block;color:#8994ae;font-size:10px;margin-bottom:3px}.emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.emoji-row button{border:1px solid #303b58;background:#151d31;color:#fff;border-radius:9px;padding:7px 9px;cursor:pointer;font-size:18px}.chat-row{display:flex;gap:7px}.overlay{position:fixed;inset:0;background:rgba(3,6,13,.78);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.result-box{width:100%;max-width:360px;background:#11182a;border:1px solid #303b58;border-radius:24px;padding:30px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.5)}.result-icon{font-size:50px;margin-bottom:12px}.result-title{font-size:28px;margin-bottom:7px}.result-text{color:#8994ae;margin-bottom:22px}@media(max-width:850px){.layout{grid-template-columns:1fr}.online-card.show{display:block}}@media(max-width:520px){body{padding:14px}.card,.online-card{padding:16px;border-radius:20px}h1{font-size:27px}.mode-panel{flex-wrap:wrap}.mode-btn{min-width:45%}.board{gap:7px}.cell{border-radius:14px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="game">
<div class="header"><div class="logo">✕◯</div><h1>Tic-Tac-Toe</h1><div class="subtitle">Classic game with a smarter challenge</div></div>
<div class="mode-panel">
<button class="mode-btn active" onclick="setMode('easy',this)">🟢 Easy</button><button class="mode-btn" onclick="setMode('medium',this)">🟡 Medium</button><button class="mode-btn" onclick="setMode('impossible',this)">🔴 Impossible</button><button class="mode-btn" onclick="setMode('friend',this)">👥 Friend</button><button class="mode-btn" onclick="setMode('online',this)">🌐 Online Friend</button>
</div>
<div class="layout">
<div class="card">
<div class="status" id="status">Your turn <span>• X</span></div>
<div class="scoreboard"><div class="score"><div class="score-label" id="player1Label">YOU (X)</div><div class="score-value" id="scoreX">0</div></div><div class="score"><div class="score-label">DRAWS</div><div class="score-value" id="scoreDraw">0</div></div><div class="score"><div class="score-label" id="player2Label">AI (O)</div><div class="score-value" id="scoreO">0</div></div></div>
<div class="board" id="board"></div>
<div class="actions"><button class="action-btn primary" onclick="newRound()">🔄 New Round</button><button class="action-btn" onclick="resetGame()">↻ Reset Score</button></div>
</div>
<div class="online-card" id="onlineCard">
<h2>🌐 Online Friend</h2>
<div class="online-row"><button class="online-btn" onclick="createRoom()">Create Room</button><button class="online-btn secondary" onclick="leaveRoom()">Leave</button></div>
<div class="online-row"><input id="roomInput" placeholder="Enter room code"><button class="online-btn" onclick="joinRoom()">Join</button></div>
<div class="room"><small>Your room code</small><strong id="roomCode">------</strong></div>
<div class="online-row"><button class="online-btn secondary" onclick="copyRoom()">📋 Copy Code</button></div>
<div class="notice" id="onlineNotice">Create a room. Send the code to your friend. Host plays X, friend plays O.</div>
<h3>💬 Live Chat</h3><div class="chat" id="chat"></div>
<div class="emoji-row"><button onclick="sendEmoji('😀')">😀</button><button onclick="sendEmoji('😂')">😂</button><button onclick="sendEmoji('🔥')">🔥</button><button onclick="sendEmoji('GG')">GG</button><button onclick="sendEmoji('😱')">😱</button><button onclick="sendEmoji('🎉')">🎉</button><button onclick="sendEmoji('👏')">👏</button></div>
<div class="chat-row"><input class="chat-input" id="chatInput" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendChat()"><button class="online-btn" onclick="sendChat()">Send</button></div>
</div></div>
<div class="footer">Choose a mode and start playing</div></div>
<div class="overlay" id="overlay"><div class="result-box"><div class="result-icon" id="resultIcon">🏆</div><div class="result-title" id="resultTitle">You Win!</div><div class="result-text" id="resultText">Great move!</div><button class="action-btn primary" onclick="closeResult();newRound()">▶ Play Again</button></div></div>
<script>
const boardElement=document.getElementById('board'),statusElement=document.getElementById('status');let board=['','','','','','','','',''],currentPlayer='X',gameOver=false,mode='easy',scoreX=0,scoreO=0,scoreDraw=0;
let peer=null,conn=null,isHost=false,myMark='X',onlineReady=false;
const winningLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function setMode(newMode,button){mode=newMode;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));button.classList.add('active');document.getElementById('onlineCard').classList.toggle('show',mode==='online');if(mode==='friend'){player1Label.textContent='PLAYER 1 (X)';player2Label.textContent='PLAYER 2 (O)'}else if(mode==='online'){player1Label.textContent='YOU (X/O)';player2Label.textContent='FRIEND (X/O)'}else{player1Label.textContent='YOU (X)';player2Label.textContent='AI (O)'}newRound();}
function renderBoard(){boardElement.innerHTML='';board.forEach((value,index)=>{const cell=document.createElement('button');cell.className='cell';if(value){cell.textContent=value;cell.classList.add(value.toLowerCase())}if(gameOver||value||(mode==='online'&&currentPlayer!==myMark))cell.classList.add('disabled');cell.onclick=()=>playerMove(index);boardElement.appendChild(cell)})}
function playerMove(index){if(gameOver||board[index]|| (mode==='online'&&currentPlayer!==myMark))return;board[index]=currentPlayer;renderBoard();const result=checkGame(board);if(result){finishGame(result);if(mode==='online')send({type:'gameover',board,result});return}if(mode==='friend'){currentPlayer=currentPlayer==='X'?'O':'X';updateStatus();return}if(mode==='online'){currentPlayer=currentPlayer==='X'?'O':'X';send({type:'state',board,turn:currentPlayer});updateStatus();return}currentPlayer='O';updateStatus();setTimeout(aiMove,450)}
function aiMove(){if(gameOver)return;let move;if(mode==='easy')move=randomMove();else if(mode==='medium')move=mediumMove();else move=impossibleMove();if(move!==-1){board[move]='O';renderBoard();const result=checkGame(board);if(result){finishGame(result);return}}currentPlayer='X';updateStatus()}
function randomMove(){const a=getAvailableMoves(board);return a.length?a[Math.floor(Math.random()*a.length)]:-1}
function mediumMove(){const a=getAvailableMoves(board);if(!a.length)return -1;for(const move of a){board[move]='O';if(checkWinner(board,'O')){board[move]='';return move}board[move]=''}for(const move of a){board[move]='X';if(checkWinner(board,'X')){board[move]='';return move}board[move]=''}if(board[4]==='')return 4;const corners=[0,2,6,8].filter(i=>board[i]==='');if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return randomMove()}
function impossibleMove(){let bestScore=-Infinity,bestMove=-1;for(const move of getAvailableMoves(board)){board[move]='O';const s=minimax(board,false);board[move]='';if(s>bestScore){bestScore=s;bestMove=move}}return bestMove}
function minimax(position,isMax){const r=checkGame(position);if(r){if(r.winner==='O')return 10;if(r.winner==='X')return -10;if(r.draw)return 0}const a=getAvailableMoves(position);if(isMax){let best=-Infinity;for(const m of a){position[m]='O';best=Math.max(best,minimax(position,false));position[m]=''}return best}else{let best=Infinity;for(const m of a){position[m]='X';best=Math.min(best,minimax(position,true));position[m]=''}return best}}
function checkWinner(position,player){return winningLines.some(line=>line.every(i=>position[i]===player))}
function checkGame(position){for(const line of winningLines){const[a,b,c]=line;if(position[a]&&position[a]===position[b]&&position[a]===position[c])return{winner:position[a],line}}if(!position.includes(''))return{draw:true};return null}
function finishGame(result){gameOver=true;renderBoard();if(result.winner){highlightWinner(result.line);if(result.winner==='X'){scoreX++;showResult('🏆',mode==='friend'?'Player 1 Wins!':mode==='online'?(myMark==='X'?'You Win!':'Friend Wins!'):'You Win!','New round starting...')}else{scoreO++;showResult('🏆',mode==='friend'?'Player 2 Wins!':mode==='online'?(myMark==='O'?'You Win!':'Friend Wins!'):'AI Wins!','New round starting...')}}else{scoreDraw++;showResult('🤝','It\'s a Draw!','New round starting...')}updateScores();if(mode!=='online')setTimeout(()=>{closeResult();newRound()},2000)}
function highlightWinner(line){document.querySelectorAll('.cell').forEach((c,i)=>{if(line.includes(i))c.classList.add('winner')})}
function updateStatus(){if(gameOver)return;if(mode==='friend')statusElement.innerHTML=currentPlayer==='X'?'Player 1 turn <span>• X</span>':'Player 2 turn <span>• O</span>';else if(mode==='online')statusElement.innerHTML=onlineReady?(currentPlayer===myMark?'Your turn <span>• '+myMark+'</span>':'Friend turn <span>• '+currentPlayer+'</span>'):'Create or join a room';else statusElement.innerHTML=currentPlayer==='X'?'Your turn <span>• X</span>':'AI is thinking <span>• O</span>'}
function getAvailableMoves(position){const m=[];position.forEach((v,i)=>{if(v==='')m.push(i)});return m}
function newRound(){board=['','','','','','','','',''];currentPlayer='X';gameOver=false;if(mode==='online'&&onlineReady){currentPlayer=isHost?'X':'X';send({type:'newround',board,turn:'X'})}closeResult();renderBoard();updateStatus()}
function resetGame(){scoreX=0;scoreO=0;scoreDraw=0;updateScores();newRound()}
function updateScores(){scoreXEl.textContent=scoreX;scoreOEl.textContent=scoreO;scoreDrawEl.textContent=scoreDraw}
const scoreXEl=document.getElementById('scoreX'),scoreOEl=document.getElementById('scoreO'),scoreDrawEl=document.getElementById('scoreDraw'),player1Label=document.getElementById('player1Label'),player2Label=document.getElementById('player2Label');
function showResult(icon,title,text){resultIcon.textContent=icon;resultTitle.textContent=title;resultText.textContent=text;overlay.classList.add('show')}
function closeResult(){overlay.classList.remove('show')}
function createRoom(){leaveRoom();isHost=true;myMark='X';const id=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer(id);roomCode.textContent=id;peer.on('open',()=>{onlineReady=false;onlineNotice.textContent='Room ready. Send this code to your friend.';updateStatus()});peer.on('connection',c=>{conn=c;setupConnection()});peer.on('error',e=>onlineNotice.textContent='Error: '+e.type)}
function joinRoom(){const id=roomInput.value.trim().toUpperCase();if(!id)return alert('Enter room code');leaveRoom();isHost=false;myMark='O';peer=new Peer();roomCode.textContent=id;peer.on('open',()=>{conn=peer.connect(id);setupConnection()});peer.on('error',e=>onlineNotice.textContent='Error: '+e.type)}
function setupConnection(){conn.on('open',()=>{onlineReady=true;onlineNotice.textContent='🟢 Friend connected! You are '+myMark+'.';addMessage('System','Friend connected');send({type:'hello',mark:myMark});if(isHost)send({type:'state',board,turn,gameOver});updateStatus();renderBoard()});conn.on('data',data=>{if(data.type==='state'){board=data.board;currentPlayer=data.turn;gameOver=data.gameOver||false;renderBoard();updateStatus()}else if(data.type==='gameover'){board=data.board;renderBoard();finishRemote(data.result)}else if(data.type==='newround'){board=data.board;currentPlayer=data.turn;gameOver=false;closeResult();renderBoard();updateStatus()}else if(data.type==='chat')addMessage('Friend',data.text);else if(data.type==='emoji')addMessage('Friend',data.emoji);else if(data.type==='hello'){onlineNotice.textContent='🟢 Friend connected! You are '+myMark+'.'}});conn.on('close',()=>{onlineReady=false;onlineNotice.textContent='🔴 Friend disconnected';updateStatus()})}
function finishRemote(result){gameOver=true;renderBoard();if(result.winner)highlightWinner(result.line);if(result.winner==='X'){if(myMark==='X')scoreX++;else scoreX++;showResult('🏆',myMark==='X'?'You Win!':'Friend Wins!','Round finished.')}else if(result.winner==='O'){scoreO++;showResult('🏆',myMark==='O'?'You Win!':'Friend Wins!','Round finished.')}else{scoreDraw++;showResult('🤝','It\'s a Draw!','Round finished.')}updateScores()}
function send(data){if(conn&&conn.open)conn.send(data)}
function leaveRoom(){if(conn)try{conn.close()}catch(e){};if(peer)try{peer.destroy()}catch(e){};conn=null;peer=null;onlineReady=false;isHost=false;roomCode.textContent='------';onlineNotice.textContent='Create a room. Send the code to your friend. Host plays X, friend plays O.';if(mode==='online'){newRound()}}
function copyRoom(){const r=roomCode.textContent;if(r&&r!=='------')navigator.clipboard?.writeText(r).then(()=>onlineNotice.textContent='Room code copied ✓')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addMessage(name,text,me=false){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.innerHTML='<small>'+escapeHtml(name)+'</small>'+escapeHtml(text);chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function sendChat(){const i=chatInput,t=i.value.trim();if(!t)return;if(!onlineReady)return alert('Connect with a friend first.');addMessage('You',t,true);send({type:'chat',text:t});i.value=''}
function sendEmoji(e){if(!onlineReady)return alert('Connect with a friend first.');addMessage('You',e,true);send({type:'emoji',emoji:e})}
renderBoard();updateStatus();updateScores();
</script>
</body></html>
