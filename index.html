<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tic-Tac-Toe</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 10%,#5a3218 0,#2a160b 38%,#120a05 100%);color:#fff;display:flex;justify-content:center;align-items:center;padding:18px;overflow-x:hidden;position:relative}body:before,body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.12;pointer-events:none}body:before{background:#d08a45;top:-180px;left:-140px}body:after{background:#7b4a27;right:-180px;bottom:-190px}.game{width:100%;max-width:1120px;position:relative;z-index:1}.header{text-align:center;margin-bottom:16px}.logo{width:58px;height:58px;margin:auto;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,#6f4323,#2b160b);border:2px solid #a66b37;box-shadow:inset 0 2px 0 #d09a62,0 10px 35px rgba(0,0,0,.5)}h1{margin-top:10px;font-size:32px;letter-spacing:-1px}.subtitle{margin-top:5px;color:#d1ae8a;font-size:13px}.mode-panel{background:linear-gradient(145deg,rgba(82,48,25,.97),rgba(38,20,10,.97));border:1px solid #7d512d;border-radius:18px;padding:6px;display:flex;gap:5px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px rgba(255,220,170,.12);backdrop-filter:blur(14px)}.mode-btn{flex:1;border:0;background:transparent;color:#d1ae8a;padding:11px 7px;border-radius:13px;cursor:pointer;font-weight:800;font-size:12px;transition:.2s}.mode-btn:hover{color:#fff;background:#694022}.mode-btn.active{background:linear-gradient(135deg,#b86f32,#7e431d);color:#fff;box-shadow:0 7px 20px rgba(0,0,0,.35)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}.card,.online-card{background:linear-gradient(145deg,rgba(82,48,25,.97),rgba(38,20,10,.97));border:1px solid #7d512d;border-radius:26px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,220,170,.12);backdrop-filter:blur(14px)}.status{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 15px;margin:0 auto 15px;position:relative;left:50%;transform:translateX(-50%);font-size:14px;font-weight:900;background:#3a2112;border:1px solid #89582f;border-radius:999px;color:#e9ecff;box-shadow:0 8px 22px rgba(0,0,0,.2)}.status span{color:#f0b16a;margin-left:5px}.scoreboard{display:grid;grid-template-columns:1fr .8fr 1fr;gap:9px;margin-bottom:17px}.score{background:linear-gradient(145deg,#6a3e20,#3a1f10);border:1px solid #8b5a32;border-radius:17px;text-align:center;padding:11px 5px;position:relative;overflow:hidden}.score-label{font-size:10px;color:#d2ad88;margin-bottom:4px;font-weight:800;letter-spacing:.5px}.score-value{font-size:25px;font-weight:900}.board-wrap{width:min(100%,455px);margin:auto;padding:12px;border-radius:25px;background:linear-gradient(145deg,#8b572f,#4b2814);border:3px solid #a56c3b;box-shadow:inset 0 0 30px rgba(40,18,6,.7),0 20px 45px rgba(0,0,0,.45)}.board{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:2px solid #8a562f;border-radius:10px;background:linear-gradient(145deg,#d29a5e,#a96834);color:#fff;font-size:clamp(44px,9vw,72px);font-weight:900;font-family:Georgia,serif;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 rgba(255,230,190,.3),inset 0 -5px 10px rgba(70,30,8,.2),0 5px 10px rgba(0,0,0,.25);text-shadow:2px 3px 0 rgba(50,20,5,.35)}.cell:hover:not(.disabled){background:linear-gradient(145deg,#e0aa6e,#b9753c);border-color:#f0c58e;transform:translateY(-3px) scale(1.02)}.cell.x{color:#fff4dc}.cell.o{color:#ffd39b}.cell.winner{background:linear-gradient(145deg,#e9b979,#b86e31);border-color:#ffe0a8;box-shadow:0 0 28px rgba(255,197,112,.65),inset 0 0 20px rgba(255,235,190,.18);transform:scale(1.04);animation:pulseWin .7s infinite alternate}.cell.disabled{cursor:not-allowed;opacity:.92}@keyframes pulseWin{to{filter:brightness(1.2)}}.actions{display:flex;gap:9px;margin-top:16px}.action-btn{flex:1;border:1px solid #9a673b;background:linear-gradient(145deg,#9a5d2d,#633217);color:#fff;padding:12px;border-radius:14px;cursor:pointer;font-weight:900;transition:.2s}.action-btn:hover{background:#7a4420;transform:translateY(-1px)}.action-btn.primary{border:0;background:linear-gradient(135deg,#c47a37,#7f421d);box-shadow:0 8px 22px rgba(0,0,0,.3)}.action-btn.primary:hover{filter:brightness(1.12)}.footer{text-align:center;margin-top:13px;color:#d1ae8a;font-size:11px}.online-card{display:none}.online-card.show{display:block}.online-card h2{font-size:19px;margin-bottom:12px}.online-card h3{font-size:14px;margin:16px 0 9px}.online-row{display:flex;gap:8px;margin-bottom:8px}.online-row input,.chat-input{min-width:0;flex:1;background:#2b170c;color:#fff;border:1px solid #7a4e2a;border-radius:11px;padding:11px;outline:none}.online-row input:focus,.chat-input:focus{border-color:#c47a37;box-shadow:0 0 0 3px rgba(196,122,55,.2)}.online-btn{border:0;background:linear-gradient(145deg,#9a5d2d,#633217);color:#fff;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.secondary{background:#3a2112!important;border:1px solid #7a4e2a!important}.room{padding:12px;background:linear-gradient(145deg,#6a3d1e,#341b0d);border:1px solid #8b5a32;border-radius:13px;margin-bottom:8px;text-align:center}.room small{display:block;color:#d2ad88;font-size:10px;margin-bottom:3px}.room strong{font-size:23px;letter-spacing:5px;color:#ffd19b;text-shadow:0 0 18px rgba(255,180,90,.35)}.notice{font-size:11px;color:#d2ad88;line-height:1.5;margin:9px 0}.chat{height:220px;overflow:auto;background:#211108;border:1px solid #6e4527;border-radius:13px;padding:9px;display:flex;flex-direction:column;gap:7px}.msg{max-width:90%;background:#4a2a16;border-radius:12px;padding:8px 10px;word-break:break-word;font-size:13px}.msg.me{align-self:flex-end;background:linear-gradient(135deg,#8a4d23,#b56b2f)}.msg small{display:block;color:#d2ad88;font-size:9px;margin-bottom:3px}.emoji-row{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.emoji-row button{border:1px solid #76502f;background:#3b2111;color:#fff;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:17px;transition:.15s}.emoji-row button:hover{transform:translateY(-2px);background:#59331a}.chat-row{display:flex;gap:7px}.overlay{position:fixed;inset:0;background:rgba(2,4,10,.78);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.result-box{width:100%;max-width:380px;background:linear-gradient(145deg,#70411f,#2e180b);border:1px solid #9b6538;border-radius:28px;padding:30px;text-align:center;box-shadow:0 25px 90px rgba(0,0,0,.65)}.result-icon{font-size:56px;margin-bottom:9px}.result-title{font-size:28px;margin-bottom:6px}.result-text{color:#d2ad88;margin-bottom:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}.online-card.show{display:block}}@media(max-width:520px){body{padding:10px}.card,.online-card{padding:14px;border-radius:22px}h1{font-size:27px}.mode-panel{flex-wrap:wrap}.mode-btn{min-width:45%}.board-wrap{padding:7px;border-radius:20px}.board{gap:7px}.cell{border-radius:14px}.actions{flex-direction:column}.scoreboard{gap:6px}}
</style>
</head>
<body>
<div class="game">
<div class="header"><div class="logo">✕◯</div><h1>Tic-Tac-Toe</h1><div class="subtitle">Classic game with a smarter challenge</div></div>
<div class="mode-panel">
<button class="mode-btn active" onclick="setMode('easy',this)">🟢 Easy</button><button class="mode-btn" onclick="setMode('medium',this)">🟡 Medium</button><button class="mode-btn" onclick="setMode('impossible',this)">🔴 Impossible</button><button class="mode-btn" onclick="setMode('friend',this)">👥 Friend</button><button class="mode-btn" onclick="setMode('online',this)">🌐 Online Friend</button>
</div>
<div class="layout">
<div class="card">
<div class="status" id="status">Your turn <span>• X</span></div>
<div class="scoreboard"><div class="score"><div class="score-label" id="player1Label">YOU (X)</div><div class="score-value" id="scoreX">0</div></div><div class="score"><div class="score-label">DRAWS</div><div class="score-value" id="scoreDraw">0</div></div><div class="score"><div class="score-label" id="player2Label">AI (O)</div><div class="score-value" id="scoreO">0</div></div></div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="actions"><button class="action-btn primary" onclick="newRound()">🔄 New Round</button><button class="action-btn" onclick="resetGame()">↻ Reset Score</button></div>
</div>
<div class="online-card" id="onlineCard">
<h2>🌐 Online Friend</h2>
<div class="online-row"><button class="online-btn" onclick="createRoom()">Create Room</button><button class="online-btn secondary" onclick="leaveRoom()">Leave</button></div>
<div class="online-row"><input id="roomInput" placeholder="Enter room code"><button class="online-btn" onclick="joinRoom()">Join</button></div>
<div class="room"><small>Your room code</small><strong id="roomCode">------</strong></div>
<div class="online-row"><button class="online-btn secondary" onclick="copyRoom()">📋 Copy Code</button></div>
<div class="notice" id="onlineNotice">Create a room. Send the code to your friend. Host plays X, friend plays O.</div>
<h3>💬 Live Chat</h3><div class="chat" id="chat"></div>
<div class="emoji-row"><button onclick="sendEmoji('😀')">😀</button><button onclick="sendEmoji('😂')">😂</button><button onclick="sendEmoji('🔥')">🔥</button><button onclick="sendEmoji('GG')">GG</button><button onclick="sendEmoji('😱')">😱</button><button onclick="sendEmoji('🎉')">🎉</button><button onclick="sendEmoji('👏')">👏</button></div>
<div class="chat-row"><input class="chat-input" id="chatInput" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendChat()"><button class="online-btn" onclick="sendChat()">Send</button></div>
</div></div>
<div class="footer">Choose a mode and start playing</div></div>
<div class="overlay" id="overlay"><div class="result-box"><div class="result-icon" id="resultIcon">🏆</div><div class="result-title" id="resultTitle">You Win!</div><div class="result-text" id="resultText">Great move!</div><button class="action-btn primary" onclick="closeResult();newRound()">▶ Play Again</button></div></div>

<script>
const boardElement=document.getElementById('board'),statusElement=document.getElementById('status');
let board=['','','','','','','','',''],currentPlayer='X',gameOver=false,mode='easy',scoreX=0,scoreO=0,scoreDraw=0;
let peer=null,conn=null,isHost=false,myMark='X',onlineReady=false,roundStarter='X',onlinePending=false,onlineSeq=0,nextRoundStarter=null;
let aiTimer=null, roundToken=0;
const winningLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function clearAiTimer(){
  if(aiTimer){
    clearTimeout(aiTimer);
    aiTimer=null;
  }
}

function updatePlayerLabels(){
  if(mode==='friend'){player1Label.textContent='PLAYER 1 (X)';player2Label.textContent='PLAYER 2 (O)'}
  else if(mode==='online'){
    if(myMark==='X'){player1Label.textContent='YOU (X)';player2Label.textContent='FRIEND (O)'}
    else{player1Label.textContent='FRIEND (X)';player2Label.textContent='YOU (O)'}
  }else{player1Label.textContent='YOU (X)';player2Label.textContent='AI (O)'}
}

function setMode(newMode,button){
  clearAiTimer();
  roundToken++;
  mode=newMode;
  roundStarter='X';
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  document.getElementById('onlineCard').classList.toggle('show',mode==='online');
  updatePlayerLabels();
  newRound(false);
}

function renderBoard(){
  boardElement.innerHTML='';
  board.forEach((value,index)=>{
    const cell=document.createElement('button');
    cell.className='cell';
    if(value){
      cell.textContent=value;
      cell.classList.add(value.toLowerCase());
    }
    const aiTurnLock=(mode!=='friend'&&mode!=='online'&&currentPlayer!=='X');
    const locked=gameOver||!!value||aiTurnLock||(mode==='online'&&(currentPlayer!==myMark||!onlineReady||onlinePending));
    if(locked){
      cell.classList.add('disabled');
      cell.disabled=true;
    }else{
      cell.onclick=()=>playerMove(index);
    }
    boardElement.appendChild(cell);
  });
}

function playerMove(index){
  if(gameOver||board[index])return;
  if(mode==='online'){
    if(!onlineReady||currentPlayer!==myMark||onlinePending)return;
    onlinePending=true;
    renderBoard();
    if(isHost) applyOnlineMove(index,myMark,true);
    else send({type:'move',index,mark:'O',seq:onlineSeq});
    return;
  }
  if(mode!=='friend' && currentPlayer!=='X')return;
  
  board[index]=currentPlayer;
  const result=checkGame(board);
  if(result){finishGame(result);return}
  
  currentPlayer=currentPlayer==='X'?'O':'X';
  renderBoard();
  updateStatus();
  
  if(mode==='friend')return;
  
  const token=roundToken;
  clearAiTimer();
  aiTimer=setTimeout(()=>{
    aiTimer=null;
    if(token===roundToken && mode!=='friend' && !gameOver && currentPlayer==='O'){
      aiMove();
    }
  },450);
}

function broadcastOnlineState(result=null){
  onlineSeq++;
  send({type:'state',seq:onlineSeq,board:[...board],turn:currentPlayer,starter:roundStarter,gameOver:!!gameOver,result});
}

function applyOnlineMove(index,mark,localHostMove=false){
  if(!isHost||!onlineReady||gameOver||!Number.isInteger(index)||index<0||index>8||board[index]){
    onlinePending=false;renderBoard();updateStatus();return;
  }
  const expectedMark=currentPlayer;
  if(mark!==expectedMark || (mark==='O' && !conn)){onlinePending=false;renderBoard();updateStatus();return;}
  board[index]=expectedMark;
  const result=checkGame(board);
  if(result){
    gameOver=true; onlinePending=false;
    finishOnlineLocal(result);
    broadcastOnlineState(result);
    return;
  }
  currentPlayer=currentPlayer==='X'?'O':'X';
  onlinePending=!!(localHostMove && mark==='X' && currentPlayer==='O');
  renderBoard(); updateStatus();
  broadcastOnlineState();
}

function finishOnlineLocal(result){
  nextRoundStarter = result.winner || (roundStarter==='X'?'O':'X');
  if(result.winner==='X'){scoreX++;showResult('🏆',myMark==='X'?'You Win!':'Friend Wins!','Winner starts the next round.');}
  else if(result.winner==='O'){scoreO++;showResult('🏆',myMark==='O'?'You Win!':'Friend Wins!','Winner starts the next round.');}
  else {scoreDraw++;showResult('🤝','It’s a Draw!','Next round swaps the starting player.');}
  renderBoard();
  if(result.winner) highlightWinner(result.line);
  updateScores();
}

function aiMove(){
  if(gameOver||mode==='friend'||mode==='online'||currentPlayer!=='O')return;
  let move;
  if(mode==='easy')move=randomMove();
  else if(mode==='medium')move=mediumMove();
  else move=impossibleMove();
  
  if(move!==-1){
    board[move]='O';
    const result=checkGame(board);
    if(result){finishGame(result);return}
  }
  currentPlayer='X';
  renderBoard();
  updateStatus();
}

function randomMove(){const a=getAvailableMoves(board);return a.length?a[Math.floor(Math.random()*a.length)]:-1}
function mediumMove(){const a=getAvailableMoves(board);if(!a.length)return -1;for(const move of a){board[move]='O';if(checkWinner(board,'O')){board[move]='';return move}board[move]=''}for(const move of a){board[move]='X';if(checkWinner(board,'X')){board[move]='';return move}board[move]=''}if(board[4]==='')return 4;const corners=[0,2,6,8].filter(i=>board[i]==='');if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return randomMove()}
function impossibleMove(){let bestScore=-Infinity,bestMove=-1;for(const move of getAvailableMoves(board)){board[move]='O';const s=minimax(board,false);board[move]='';if(s>bestScore){bestScore=s;bestMove=move}}return bestMove}
function minimax(position,isMax){const r=checkGame(position);if(r){if(r.winner==='O')return 10;if(r.winner==='X')return -10;if(r.draw)return 0}const a=getAvailableMoves(position);if(isMax){let best=-Infinity;for(const m of a){position[m]='O';best=Math.max(best,minimax(position,false));position[m]=''}return best}else{let best=Infinity;for(const m of a){position[m]='X';best=Math.min(best,minimax(position,true));position[m]=''}return best}}
function checkWinner(position,player){return winningLines.some(line=>line.every(i=>position[i]===player))}
function checkGame(position){for(const line of winningLines){const[a,b,c]=line;if(position[a]&&position[a]===position[b]&&position[a]===position[c])return{winner:position[a],line}}if(!position.includes(''))return{draw:true};return null}

function finishGame(result){
  gameOver=true;
  clearAiTimer();
  renderBoard();
  if(result.winner){
    highlightWinner(result.line);
    if(result.winner==='X'){scoreX++;showResult('🏆',mode==='friend'?'Player 1 Wins!':mode==='online'?(myMark==='X'?'You Win!':'Friend Wins!'):'You Win!','Tap Play Again to start next round.')}
    else{scoreO++;showResult('🏆',mode==='friend'?'Player 2 Wins!':mode==='online'?(myMark==='O'?'You Win!':'Friend Wins!'):'AI Wins!','Tap Play Again to start next round.')}
  }else{
    scoreDraw++;showResult('🤝','It\'s a Draw!','Tap Play Again to start next round.')
  }
  updateScores();
}

function highlightWinner(line){document.querySelectorAll('.cell').forEach((c,i)=>{if(line.includes(i))c.classList.add('winner')})}
function updateStatus(){
  if(gameOver)return;
  if(mode==='friend')statusElement.innerHTML=currentPlayer==='X'?'Player 1 turn <span>• X</span>':'Player 2 turn <span>• O</span>';
  else if(mode==='online')statusElement.innerHTML=onlineReady?(currentPlayer===myMark?'Your turn <span>• '+myMark+'</span>':'Friend turn <span>• '+currentPlayer+'</span>'):'Create or join a room';
  else statusElement.innerHTML=currentPlayer==='X'?'Your turn <span>• X</span>':'AI is thinking <span>• O</span>';
}
function getAvailableMoves(position){const m=[];position.forEach((v,i)=>{if(v==='')m.push(i)});return m}

function newRound(advance=true){
  clearAiTimer();
  roundToken++;
  if(mode==='online' && onlineReady){
    if(!isHost){ send({type:'newround_request',advance}); return; }
    startOnlineRound(advance); return;
  }
  if(mode!=='friend' && mode!=='online') roundStarter='X';
  else if(advance) roundStarter=roundStarter==='X'?'O':'X';
  
  board=['','','','','','','','',''];
  currentPlayer=roundStarter;
  gameOver=false;
  onlinePending=false;
  
  closeResult();
  renderBoard();
  updateStatus();
}

function startOnlineRound(advance=true){
  if(!isHost)return;
  clearAiTimer();
  roundToken++;
  if(advance){
    if(nextRoundStarter) roundStarter=nextRoundStarter;
    else roundStarter=roundStarter==='X'?'O':'X';
  }
  nextRoundStarter=null;
  onlineSeq=0;
  board=['','','','','','','','',''];
  currentPlayer=roundStarter;
  gameOver=false;
  onlinePending=false;
  closeResult();
  renderBoard();
  updateStatus();
  broadcastOnlineState();
}

function resetGame(){
  clearAiTimer();
  roundToken++;
  scoreX=0;scoreO=0;scoreDraw=0;
  updateScores();
  newRound(false);
}

function updateScores(){scoreXEl.textContent=scoreX;scoreOEl.textContent=scoreO;scoreDrawEl.textContent=scoreDraw}
const scoreXEl=document.getElementById('scoreX'),scoreOEl=document.getElementById('scoreO'),scoreDrawEl=document.getElementById('scoreDraw'),player1Label=document.getElementById('player1Label'),player2Label=document.getElementById('player2Label');
function showResult(icon,title,text){resultIcon.textContent=icon;resultTitle.textContent=title;resultText.textContent=text;overlay.classList.add('show')}
function closeResult(){overlay.classList.remove('show')}

function createRoom(){leaveRoom();isHost=true;myMark='X';updatePlayerLabels();const id=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer(id);roomCode.textContent=id;peer.on('open',()=>{onlineReady=false;onlineNotice.textContent='Room ready. Send this code to your friend.';updateStatus()});peer.on('connection',c=>{conn=c;setupConnection()});peer.on('error',e=>onlineNotice.textContent='Error: '+e.type)}
function joinRoom(){const id=roomInput.value.trim().toUpperCase();if(!id)return alert('Enter room code');leaveRoom();isHost=false;myMark='O';updatePlayerLabels();peer=new Peer();roomCode.textContent=id;peer.on('open',()=>{conn=peer.connect(id);setupConnection()});peer.on('error',e=>onlineNotice.textContent='Error: '+e.type)}

function setupConnection(){
conn.on('open',()=>{onlineReady=true;onlinePending=false;onlineNotice.textContent='🟢 Friend connected! You are '+myMark+'.';addMessage('System','Friend connected');send({type:'hello',mark:myMark});if(isHost)broadcastOnlineState();updateStatus();renderBoard()});
conn.on('data',data=>{
  if(!data||typeof data!=='object')return;
  if(data.type==='state' && !isHost){
    if(!Number.isInteger(data.seq) || data.seq <= onlineSeq)return;
    onlineSeq=data.seq;
    if(!Array.isArray(data.board)||data.board.length!==9)return;
    board=data.board.map(v=>v==='X'||v==='O'?v:'');
    currentPlayer=data.turn==='O'?'O':'X';
    roundStarter=data.starter==='O'?'O':'X';
    gameOver=!!data.gameOver; onlinePending=false;
    renderBoard();
    if(data.result){finishRemote(data.result);}
    else updateStatus();
  }else if(data.type==='move' && isHost){
    if(data.mark!=='O'||currentPlayer!=='O'||gameOver||!Number.isInteger(data.index)||data.index<0||data.index>8||board[data.index])return;
    applyOnlineMove(data.index,'O');
  }else if(data.type==='newround_request' && isHost){startOnlineRound(!!data.advance)}
  else if(data.type==='chat')addMessage('Friend',data.text);
  else if(data.type==='emoji')addMessage('Friend',data.emoji);
  else if(data.type==='hello'){onlineNotice.textContent='🟢 Friend connected! You are '+myMark+'.';if(isHost)broadcastOnlineState();}
});
conn.on('close',()=>{onlineReady=false;onlinePending=false;onlineNotice.textContent='🔴 Friend disconnected';updateStatus();renderBoard()})
}

function finishRemote(result){
  gameOver=true;onlinePending=false;renderBoard();
  if(result.winner)highlightWinner(result.line);
  if(result.winner==='X'){scoreX++;showResult('🏆',myMark==='X'?'You Win!':'Friend Wins!','Round finished. Next round changes the starting player.');}
  else if(result.winner==='O'){scoreO++;showResult('🏆',myMark==='O'?'You Win!':'Friend Wins!','Round finished. Next round changes the starting player.');}
  else{scoreDraw++;showResult('🤝','It’s a Draw!','Round finished. Next round changes the starting player.');}
  updateScores();
}

function send(data){if(conn&&conn.open)conn.send(data)}
function leaveRoom(){if(conn)try{conn.close()}catch(e){};if(peer)try{peer.destroy()}catch(e){};conn=null;peer=null;onlineReady=false;isHost=false;onlinePending=false;onlineSeq=0;roomCode.textContent='------';onlineNotice.textContent='Create a room. Send the code to your friend. Host plays X, friend plays O.';if(mode==='online'){newRound(false)}}
function copyRoom(){const r=roomCode.textContent;if(r&&r!=='------')navigator.clipboard?.writeText(r).then(()=>onlineNotice.textContent='Room code copied ✓')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addMessage(name,text,me=false){
  const d=document.createElement('div');
  d.className='msg'+(me?' me':'');
  d.innerHTML='<small>'+escapeHtml(name)+'</small>'+escapeHtml(text);
  chat.appendChild(d);
  setTimeout(()=>{chat.scrollTop=chat.scrollHeight;},10);
}
function sendChat(){const i=chatInput,t=i.value.trim();if(!t)return;if(!onlineReady)return alert('Connect with a friend first.');addMessage('You',t,true);send({type:'chat',text:t});i.value=''}
function sendEmoji(e){if(!onlineReady)return alert('Connect with a friend first.');addMessage('You',e,true);send({type:'emoji',emoji:e})}

renderBoard();updateStatus();updateScores();
</script>
</body>
</html>
